[package]
name = "waywallen-image-plugin"
version.workspace = true

[[bin]]
name = "waywallen-image-renderer"
module = "waywallen.image.entry"
sources = [
  "src/main.cpp",
  "src/entry.cppm",
  "src/entry.cpp",
  "src/av_image.cpp",
]

[usage]
threads = true

[dependencies.waywallen-plugin-common]
workspace = true

[dependencies.wavsen]
workspace = true

[dependencies.rstd-cppstd]
workspace = true

[dependencies.rstd-json]
workspace = true

[dependencies.rstd-argparse]
workspace = true

[dependencies.rstd-log]
workspace = true

[runtime-dependencies.waywallen-bridge]
workspace = true

[external-dependencies.pkg-config.libavformat]
workspace = true

[external-dependencies.pkg-config.libavcodec]
workspace = true

[external-dependencies.pkg-config.libavutil]
workspace = true

[external-dependencies.pkg-config.libswscale]
workspace = true
