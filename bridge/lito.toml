[package]
name = "waywallen-bridge"
version.workspace = true
standard = "c99"

[lib]
name = "waywallen-bridge"
kind = "shared"
artifact = "waywallen-bridge"
linker-options = ["-Wl,--version-script=waywallen-bridge.map"]
sources = [
  "src/bridge.c",
  "src/drm_fourcc.c",
  "src/ipc_v3.c",
  "src/probe_egl.c",
  "src/probe_vk.c",
  "src/sync_release.c",
  "src/pool.c",
  "src/pool_egl_gbm.c",
  "src/pool_vulkan.c",
]

[usage]
public-include-directories = ["include"]
private-include-directories = ["src"]
private-definitions = ["_GNU_SOURCE"]
threads = true

[[test]]
name = "waywallen-bridge-pool-state"
sources = ["tests/pool_state_tests.c"]

[[test]]
name = "waywallen-bridge-protocol-v3"
sources = ["tests/protocol_v3_tests.c"]

[external-dependencies.pkg-config.gbm]
workspace = true
