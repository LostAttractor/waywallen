[workspace]
name = "waywallen"
members = [
  "bridge",
  "plugins",
  "plugins/org.waywallen.image",
  "plugins/org.waywallen.video",
  "plugins/org.waywallen.wallhaven",
  "tools/i18n",
  "tools/i18n/po",
  "ui",
]
default-members = [
  "plugins/org.waywallen.image",
  "plugins/org.waywallen.video",
  "plugins/org.waywallen.wallhaven",
  "tools/i18n",
  "ui",
]

[workspace.package]
version = "0.3.8"

[workspace.dependencies.waywallen-bridge]
path = "bridge"

[workspace.dependencies.waywallen-plugin-common]
path = "plugins"

[workspace.dependencies.rstd-cppstd]
version = "0.1.0"

[workspace.dependencies.rstd-std]
version = "0.1.0"

[workspace.dependencies.rstd-json]
version = "0.1.0"

[workspace.dependencies.rstd-argparse]
version = "0.1.0"

[workspace.dependencies.rstd-log]
version = "0.1.0"

[workspace.dependencies.rstd-toml]
version = "0.1.0"

[workspace.dependencies.luato]
git = "https://github.com/litocpp/luato.git"

[workspace.dependencies.vvk]
git = "https://github.com/litocpp/vvk.git"

[workspace.dependencies.wavsen]
git = "https://github.com/hypengw/wavsen.git"

[workspace.dependencies.ncrequest]
git = "https://github.com/hypengw/ncrequest.git"

[workspace.dependencies.qextra]
git = "https://github.com/hypengw/QExtra.git"

[workspace.dependencies.lito-qt]
builtin = "qt"

[workspace.external-dependencies.pkg-config.gbm]
module = "gbm"

[workspace.external-dependencies.pkg-config.libavformat]
module = "libavformat"
version = ">= 58"

[workspace.external-dependencies.pkg-config.libavcodec]
module = "libavcodec"
version = ">= 58"

[workspace.external-dependencies.pkg-config.libavutil]
module = "libavutil"
version = ">= 56"

[workspace.external-dependencies.pkg-config.libswscale]
module = "libswscale"
version = ">= 5"

[workspace.external-sources.waywallen-control]
path = "proto"

[workspace.external-sources.waywallen-rust]
path = "."

[workspace.external-dependencies.cargo.waywallen-daemon]
source = "waywallen-rust"
package = "waywallen"

[workspace.external-sources.qml-material]
git = "https://github.com/hypengw/QmlMaterial.git"

[workspace.external-dependencies.cmake.qml-material]
package = "qml_material"
source = "qml-material"
adapter = "ui/cmake/QmlMaterial.cmake"
cache = { QML_MATERIAL_BUILD_TYPE = "STATIC", QM_BUILD_EXAMPLE = false, QM_BUILD_TESTS = false }

[workspace.external-dependencies.cmake.qt6]
package = "Qt6"
components = [
  "Core",
  "DBus",
  "LinguistTools",
  "Protobuf",
  "ProtobufQuick",
  "ProtobufWellKnownTypes",
  "Quick",
  "QuickControls2",
  "QuickPrivate",
  "WebSockets",
]
host-tools = [
  { name = "lrelease", target = "Qt6::lrelease" },
  { name = "moc", target = "Qt6::moc" },
  { name = "protoc", target = "WrapProtoc::WrapProtoc" },
  { name = "qmlcachegen", target = "Qt6::qmlcachegen" },
  { name = "qmlimportscanner", target = "Qt6::qmlimportscanner" },
  { name = "qmltyperegistrar", target = "Qt6::qmltyperegistrar" },
  { name = "qtprotobufgen", target = "Qt6::qtprotobufgen" },
  { name = "rcc", target = "Qt6::rcc" },
]
